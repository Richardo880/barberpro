version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: barberpro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: barberpro
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: barberpro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberpro"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barberpro-network

  # Next.js Application (Development)
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    container_name: barberpro-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://barberpro:${DB_PASSWORD:-password}@postgres:5432/barberpro"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Use named volumes for node_modules (evita problemas cross-platform)
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - barberpro-network

  # Redis (Opcional - para rate limiting y cache)
  # redis:
  #   image: redis:7-alpine
  #   container_name: barberpro-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - barberpro-network

volumes:
  postgres_data:
  # redis_data:

networks:
  barberpro-network:
    driver: bridge
